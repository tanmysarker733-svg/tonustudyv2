<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Premium Button</title>
  <style>
    /* Center the button on the screen for presentation */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* From Uiverse.io by ilkhoeri (Modified) */ 
    .button {
      --h-button: 48px;
      --w-button: 102px;
      --round: 0.75rem;
      cursor: pointer;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      background: radial-gradient(
          65.28% 65.28% at 50% 100%,
          rgba(223, 113, 255, 0.8) 0%,
          rgba(223, 113, 255, 0) 100%
        ),
        linear-gradient(0deg, #7a5af8, #7a5af8);
      border-radius: var(--round);
      border: none;
      outline: none;
      padding: 12px 24px; /* Slightly adjusted padding for "Continue" text */
      box-shadow: 0 4px 20px rgba(122, 90, 248, 0.3);
    }

    .button::before,
    .button::after {
      content: "";
      position: absolute;
      inset: var(--space);
      transition: all 0.5s ease-in-out;
      border-radius: calc(var(--round) - var(--space));
      z-index: 0;
    }

    .button::before {
      --space: 1px;
      background: linear-gradient(
        177.95deg,
        rgba(255, 255, 255, 0.25) 0%,
        rgba(255, 255, 255, 0) 100%
      );
    }

    .button::after {
      --space: 2px;
      background: radial-gradient(
          65.28% 65.28% at 50% 100%,
          rgba(223, 113, 255, 0.8) 0%,
          rgba(223, 113, 255, 0) 100%
        ),
        linear-gradient(0deg, #7a5af8, #7a5af8);
    }

    .button:active {
      transform: scale(0.96);
    }

    /* Premium SaaS Wipe Effect */
    .saas-wipe {
      position: absolute;
      top: 0;
      left: -150%;
      width: 80%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.35) 30%,
        rgba(255, 255, 255, 0.5) 50%,
        rgba(255, 255, 255, 0.35) 70%,
        transparent
      );
      transform: skewX(-30deg);
      z-index: 3;
      pointer-events: none;
    }

    /* Triggered via JS on click to guarantee full animation play */
    .button.wiping .saas-wipe {
      animation: premium-wipe 0.65s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes premium-wipe {
      0% {
        left: -150%;
      }
      100% {
        left: 200%;
      }
    }

    /* Background Particle System */
    .points_wrapper {
      overflow: hidden;
      width: 100%;
      height: 100%;
      pointer-events: none;
      position: absolute;
      z-index: 1;
    }

    .points_wrapper .point {
      bottom: -10px;
      position: absolute;
      animation: floating-points infinite ease-in-out;
      pointer-events: none;
      width: 2px;
      height: 2px;
      background-color: #fff;
      border-radius: 9999px;
    }

    @keyframes floating-points {
      0% {
        transform: translateY(0);
      }
      85% {
        opacity: 0;
      }
      100% {
        transform: translateY(-55px);
        opacity: 0;
      }
    }

    .points_wrapper .point:nth-child(1) { left: 10%; opacity: 1; animation-duration: 2.35s; animation-delay: 0.2s; }
    .points_wrapper .point:nth-child(2) { left: 30%; opacity: 0.7; animation-duration: 2.5s; animation-delay: 0.5s; }
    .points_wrapper .point:nth-child(3) { left: 25%; opacity: 0.8; animation-duration: 2.2s; animation-delay: 0.1s; }
    .points_wrapper .point:nth-child(4) { left: 44%; opacity: 0.6; animation-duration: 2.05s; }
    .points_wrapper .point:nth-child(5) { left: 50%; opacity: 1; animation-duration: 1.9s; }
    .points_wrapper .point:nth-child(6) { left: 75%; opacity: 0.5; animation-duration: 1.5s; animation-delay: 1.5s; }
    .points_wrapper .point:nth-child(7) { left: 88%; opacity: 0.9; animation-duration: 2.2s; animation-delay: 0.2s; }
    .points_wrapper .point:nth-child(8) { left: 58%; opacity: 0.8; animation-duration: 2.25s; animation-delay: 0.2s; }
    .points_wrapper .point:nth-child(9) { left: 98%; opacity: 0.6; animation-duration: 2.6s; animation-delay: 0.1s; }
    .points_wrapper .point:nth-child(10) { left: 65%; opacity: 1; animation-duration: 2.5s; animation-delay: 0.2s; }

    /* Foreground Content */
    .inner {
      z-index: 2;
      gap: 8px;
      position: relative;
      width: 100%;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
      line-height: 1.5;
      transition: color 0.2s ease-in-out;
    }

    .inner svg.icon {
      width: 18px;
      height: 18px;
      transition: fill 0.1s linear;
    }

    .button:focus svg.icon {
      fill: white;
    }

    .button:hover svg.icon {
      fill: transparent;
      animation:
        dasharray 1s linear forwards,
        filled 0.1s linear forwards 0.95s;
    }

    @keyframes dasharray {
      from {
        stroke-dasharray: 0 0 0 0;
      }
      to {
        stroke-dasharray: 68 68 0 0;
      }
    }

    @keyframes filled {
      to {
        fill: white;
      }
    }
  </style>
</head>
<body>

  <button type="button" class="button" id="saasButton">
    <!-- SaaS Wipe Layer Structure -->
    <span class="saas-wipe"></span>

    <!-- Ambient Particles Layer -->
    <div class="points_wrapper">
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
    </div>

    <!-- Content Layer -->
    <span class="inner">
      <svg
        class="icon"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2.5"
      >
        <polyline points="13.18 1.37 13.18 9.64 21.45 9.64 10.82 22.63 10.82 14.36 2.55 14.36 13.18 1.37"></polyline>
      </svg>
      Continue
    </span>
  </button>

  <script>
    const button = document.getElementById('saasButton');
    
    button.addEventListener('click', () => {
      // Avoid animation overlap if clicked rapidly
      button.classList.remove('wiping');
      void button.offsetWidth; // Trigger reflow to restart animation smoothly
      button.classList.add('wiping');
    });

    // Clean up class once the animation finishes
    button.addEventListener('animationend', (e) => {
      if (e.animationName === 'premium-wipe') {
        button.classList.remove('wiping');
      }
    });
  </script>

</body>
</html>
