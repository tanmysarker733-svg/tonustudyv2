<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Tonu Study — Offline</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      background: #071526; color: #eaf3ff; padding: 24px;
    }
    main {
      width: min(420px, 100%); padding: 28px; text-align: center;
      border: 1px solid #315071; border-radius: 24px; background: #10243d;
      box-shadow: 0 20px 60px #0007;
    }
    .mark {
      width: 66px; height: 66px; display: grid; place-items: center; margin: 0 auto 18px;
      border-radius: 50%; background: #74448a; font-size: 34px;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 20px; color: #aac0d9; line-height: 1.55; }
    button {
      width: 100%; min-height: 46px; border: 0; border-radius: 13px;
      color: white; background: linear-gradient(135deg,#8b5aa1,#5c3170);
      font: inherit; font-weight: 750;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>You’re offline</h1>
    <p>Your existing local study data is safe. Reconnect, then retry to sync the latest web app.</p>
    <button onclick="TonuAndroid.retry()">Retry connection</button>
  </main>
</body>
</html>
